[package]
name = "claude-trader-engine"
version = "0.1.0"
edition = "2021"
description = "Claude Trader engine: config, events, demo generator"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine-cli"
path = "src/bin/engine-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
bs58 = "0.5"
async-trait = "0.1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
flate2 = "1"

# OS secure storage: Windows Credential Manager, macOS Keychain, Linux kernel keyring. Anything else uses the encrypted file.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }
