[package]
name = "claude-trader-engine"
version = "0.1.0"
edition = "2021"
description = "Claude Trader engine: config, events, demo generator"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine-cli"
path = "src/bin/engine-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
