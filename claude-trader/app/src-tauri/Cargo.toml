[package]
name = "claude-trader-app"
version = "0.1.0"
edition = "2021"
description = "Claude Trader desktop app"

[lib]
name = "claude_trader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claude-trader-engine = { path = "../../engine" }
