name: windows-build

on:
  push:
    paths: ["claude-trader/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

# Releases (the in-app updater reads them) are created from this branch only, with the built-in GITHUB_TOKEN.
permissions:
  contents: write

env:
  RELEASE_BRANCH: claude/trader-build-prompt-v2-9pmbsi

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: claude-trader/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-trader/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: claude-trader
      - name: Check lockfile only uses the npm registry
        shell: bash
        run: |
          if grep -o '"resolved": "[^"]*"' package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "Lockfile has a non-registry URL"; exit 1
          fi
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Check live-trade gate
        shell: bash
        working-directory: claude-trader
        run: bash scripts/check-live-gate.sh
      - name: Test the Chrome extension logic
        shell: bash
        working-directory: claude-trader/extension
        run: node --test tests/core.test.js tests/xmon.test.js
      - name: Test the CI helper scripts
        shell: bash
        working-directory: claude-trader
        run: node --test scripts/ci-scripts.test.mjs
      - name: Check the updater signing key
        id: key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Updater signing key missing::The secret TAURI_SIGNING_PRIVATE_KEY is not set, so this build is NOT signed and NO release is created. The normal artifacts are still built and uploaded. Add the secret (Settings > Secrets and variables > Actions) to switch on automatic updates."
          fi
      - name: Set the app version to 0.1.${{ github.run_number }}
        shell: bash
        working-directory: claude-trader
        run: |
          if [ "${{ steps.key.outputs.present }}" = "true" ]; then
            node scripts/ci-set-version.mjs "0.1.${{ github.run_number }}" --updater
          else
            node scripts/ci-set-version.mjs "0.1.${{ github.run_number }}"
          fi
      - name: Build Windows app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        # NSIS only: the in-app updater uses the NSIS setup.exe, and skipping the MSI avoids a WiX download that can fail.
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: claude-trader-windows
          path: claude-trader/target/release/bundle/**
      - uses: actions/upload-artifact@v4
        with:
          name: claude-trader-chrome-extension
          # GitHub zips this folder. Unzip it, then Load unpacked in chrome://extensions (pick the folder that holds manifest.json).
          path: |
            claude-trader/extension
            !claude-trader/extension/tests/**
            !claude-trader/extension/README.md
      - name: Zip the Chrome extension
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ext" && mkdir -p "$RUNNER_TEMP/ext/claude-trader-chrome-extension"
          cp -r ../extension/. "$RUNNER_TEMP/ext/claude-trader-chrome-extension/"
          rm -rf "$RUNNER_TEMP/ext/claude-trader-chrome-extension/tests" "$RUNNER_TEMP/ext/claude-trader-chrome-extension/README.md"
          (cd "$RUNNER_TEMP/ext" && 7z a -tzip "$RUNNER_TEMP/claude-trader-chrome-extension.zip" claude-trader-chrome-extension > /dev/null)
          ls -l "$RUNNER_TEMP/claude-trader-chrome-extension.zip"
      - name: Check the signature before the release is created
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH) && steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.${{ github.run_number }}"
          SETUP=$(ls ../target/release/bundle/nsis/*-setup.exe | head -n 1)
          test -f "$SETUP.sig" || { echo "::error::missing $SETUP.sig (createUpdaterArtifacts did not run)"; exit 1; }
          # the .sig must be made by the private half of the public key in tauri.conf.json, for exactly this file
          node ../scripts/updater-verify.mjs local --file "$SETUP" --sig "$SETUP.sig" --version "$VERSION"
      - name: Create the GitHub release (signed update)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', env.RELEASE_BRANCH) && steps.key.outputs.present == 'true'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="0.1.${{ github.run_number }}"
          TAG="v$VERSION"
          SETUP=$(ls ../target/release/bundle/nsis/*-setup.exe | head -n 1)
          OUT="$RUNNER_TEMP/release" && rm -rf "$OUT" && mkdir -p "$OUT"
          # a name without spaces, so the download address needs no encoding
          ASSET="Claude-Trader_${VERSION}_x64-setup.exe"
          cp "$SETUP" "$OUT/$ASSET"
          cp "$SETUP.sig" "$OUT/$ASSET.sig"
          cp "$RUNNER_TEMP/claude-trader-chrome-extension.zip" "$OUT/claude-trader-chrome-extension.zip"
          git log -1 --format=%B > "$OUT/notes.txt"
          node ../scripts/make-latest-json.mjs --version "$VERSION" --sig-file "$OUT/$ASSET.sig" --notes-file "$OUT/notes.txt" \
            --repo "${{ github.repository }}" --tag "$TAG" --asset "$ASSET" > "$OUT/latest.json"
          cat "$OUT/latest.json"
          gh release create "$TAG" "$OUT/$ASSET" "$OUT/$ASSET.sig" "$OUT/latest.json" "$OUT/claude-trader-chrome-extension.zip" \
            --target "${{ github.sha }}" --title "Claude Trader $VERSION" --notes-file "$OUT/notes.txt" --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Check what the app will download (latest.json, signature, url)
        if: steps.release.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERSION="0.1.${{ github.run_number }}"
          if ! node ../scripts/updater-verify.mjs remote --repo "${{ github.repository }}" --tag "${{ steps.release.outputs.tag }}" --version "$VERSION" --asset "${{ steps.release.outputs.asset }}"; then
            # a broken release must not stay "latest": the apps would offer an update that cannot install
            gh release delete "${{ steps.release.outputs.tag }}" --cleanup-tag --yes || true
            echo "::error title=Release removed::The release failed the updater check, so it was deleted. The previous release is the latest again."
            exit 1
          fi
