name: windows-build

on:
  push:
    paths: ["claude-trader/**", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: claude-trader/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-trader/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: claude-trader
      - name: Check lockfile only uses the npm registry
        shell: bash
        run: |
          if grep -o '"resolved": "[^"]*"' package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "Lockfile has a non-registry URL"; exit 1
          fi
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Check live-trade gate
        shell: bash
        working-directory: claude-trader
        run: bash scripts/check-live-gate.sh
      - name: Test the Chrome extension logic
        shell: bash
        working-directory: claude-trader/extension
        run: node --test tests/core.test.js
      - name: Build Windows app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: claude-trader-windows
          path: claude-trader/target/release/bundle/**
      - uses: actions/upload-artifact@v4
        with:
          name: claude-trader-chrome-extension
          # GitHub zips this folder. Unzip it, then Load unpacked in chrome://extensions (pick the folder that holds manifest.json).
          path: |
            claude-trader/extension
            !claude-trader/extension/tests/**
            !claude-trader/extension/README.md
